name: Memory runtime CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --all-packages --locked
      - run: uv run pytest
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - name: Build one-domain production container
        run: docker build -t tlmn-memory .
      - name: Start production container
        run: |
          docker run -d --name tlmn -p 8080:10000 tlmn-memory
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 1
          done
          docker logs tlmn
          exit 1
      - name: Four browsers, including mobile, complete a game
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
